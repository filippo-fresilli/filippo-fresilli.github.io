<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filippo Fresilli</title>
    <meta name="description" content="Filippo Fresilli — UX/UI Designer & Developer" />
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="bento">

      <!-- Hero -->
      <div class="card card-hero">
        <span class="label">UX/UI Designer & Developer</span>
        <h1>Filippo<br />Fresilli</h1>
        <div class="hero-bottom">
          <p class="sub">Progetto le esperienze, scrivo il codice.<br />Non mi fermo al wireframe — porto il design in produzione.</p>
          <p class="hero-location">Paris, France 🇫🇷</p>
        </div>
      </div>

      <!-- Formidable -->
      <a href="https://filippo-fresilli.github.io/formidable/" target="_blank" class="card card-formidable">
        <span class="label">Progetto</span>
        <h2>Formidable</h2>
        <p class="sub">Scopri il progetto</p>
        <span class="arrow">↗</span>
      </a>

      <!-- Anni di esperienza -->
      <div class="card card-experience">
        <span class="exp-number">6</span>
        <span class="exp-label">anni di<br />esperienza</span>
      </div>

      <!-- Email -->
      <a href="mailto:filippo.fresilli@gmail.com" class="card card-email">
        <span class="emoji">✉️</span>
        <p>filippo.fresilli@gmail.com</p>
      </a>

      <!-- GitHub -->
      <a href="https://github.com/filippo-fresilli" target="_blank" class="card card-social card-github">
        <span class="social-name">GitHub</span>
        <span class="arrow-sm">↗</span>
      </a>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/filippofresilli/" target="_blank" class="card card-social card-linkedin">
        <span class="social-name">LinkedIn</span>
        <span class="arrow-sm">↗</span>
      </a>

      <!-- Behance -->
      <a href="https://www.behance.net/filippofresilli" target="_blank" class="card card-social card-behance">
        <span class="social-name">Behance</span>
        <span class="arrow-sm">↗</span>
      </a>

    </main>
    <script src="main.js"></script>
  </body>
</html>
